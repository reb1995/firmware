[env:seeed-xiao-c3]
custom_meshtastic_hw_model = 0000
custom_meshtastic_hw_model_slug = SEEED_XIAO_C3
custom_meshtastic_architecture = esp32-c3
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = Seeed Xiao ESP32-C3
custom_meshtastic_images = seeed-xiao-c3.svg
custom_meshtastic_tags = Seeed
custom_meshtastic_requires_dfu = false
custom_meshtastic_partition_scheme = 4MB

extends = esp32c3_base
board = seeed_xiao_esp32c3
board_level = pr
board_check = true
board_build.partitions = partition-table-4MB-no-OTA.csv
upload_protocol = esptool
upload_speed = 460800
build_flags =
  ${esp32c3_base.build_flags}
  -D SEEED_XIAO_C3
  -I variants/esp32c3/seeed_xiao_c3
  -D Wire1=Wire
  -DMESHTASTIC_EXCLUDE_WEBSERVER=1
