[env:seeed-xiao-c5]
custom_meshtastic_hw_model = 0000
custom_meshtastic_hw_model_slug = SEEED_XIAO_C5
custom_meshtastic_architecture = esp32-c5
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = Seeed Xiao ESP32-C5 Wio
custom_meshtastic_images = seeed-xiao-c5.svg
custom_meshtastic_tags = Seeed
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 8MB

extends = esp32c5_base
board = seeed-xiao-c5
board_level = pr
board_check = true
board_build.partitions = default_8MB.csv
upload_protocol = esptool
upload_speed = 921600
build_flags = 
  ${esp32c5_base.build_flags}
  -D SEEED_XIAO_C5
  -I variants/esp32c5/seeed_xiao_c5
  -DBOARD_HAS_PSRAM 
